name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: DirectX WARP smoke test
        shell: pwsh
        run: |
          python tests/make_vrm_fixture.py "$env:RUNNER_TEMP/test-avatar.vrm"
          $testRoot = Join-Path $env:RUNNER_TEMP 'aura-smoke'
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
          # Hosted runners have no audio endpoint. Real BGM playback is checked on the development PC.
          $arguments = @('--smoke-test', '--warp', '--silent', '--seed=42', "--vrm=$env:RUNNER_TEMP/test-avatar.vrm", "--save-dir=$testRoot/save", "--capture=$testRoot/preview.png", "--report=$testRoot/report.txt")
          $process = Start-Process -FilePath build/Release/StarRng.exe -ArgumentList $arguments -WindowStyle Hidden -PassThru
          # Software rendering and capture for all aura/cutscene paths can exceed a minute on shared runners.
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'DirectX smoke test timed out after 180 seconds' }
          if (Test-Path "$testRoot/report.txt") { Get-Content "$testRoot/report.txt" }
          if ($process.ExitCode -ne 0) { throw "DirectX smoke test failed: $($process.ExitCode)" }
      - name: Package
        run: cmake --install build --config Release --prefix package
      - uses: actions/upload-artifact@v4
        with:
          name: StarsRng-Alpha0.1-windows-x64
          path: package/
  core-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
  publish-release:
    # 通常のmain更新では配布しません。codex/release-v0.1.17-alpha.1 のような
    # 公開専用ブランチをpushした時だけ、両OSの検証成功後にリリースを作成します。
    if: github.event_name == 'push' && github.repository == 'rx107/aura-rng' && startsWith(github.ref, 'refs/heads/codex/release-')
    needs: [windows, core-portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: StarsRng-Alpha0.1-windows-x64
          path: windows-package
      - name: Build audited release archives
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#codex/release-}"
          python tools/package_release.py --windows-folder windows-package --dest dist --tag "$tag"
      - name: Publish tested binaries and source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME#codex/release-}"
          gh release create "$tag" dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Star's RNG Alpha 0.1 / $tag" --notes-file dist/release-notes.md
